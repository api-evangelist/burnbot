name: Burnbot
description: >-
  Burnbot is a wildfire mitigation and fuels management company that builds
  autonomous, remotely-operated machines and delivers field services to reduce
  hazardous vegetation and conduct controlled, precision fuel-reduction burns.
  Its equipment operates in steep, remote, and hazardous terrain around the
  clock in most weather conditions, cutting fuel loads without disturbing
  healthy vegetation or compacting soil, and is used across fire hazard
  mitigation, systematic fuels management, and timber operations. Burnbot works
  with utilities, transportation agencies, land managers, and tribal
  governments including PG&E, Caltrans, the U.S. Forest Service, and CAL FIRE.
  Burnbot was surfaced as a portfolio company of DCVC and added to the API
  Evangelist network. It is a hardware and field-services company with no public
  developer API surface at this time.
